syntax = "proto3";

package uba.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";


// 自定义看板服务
service DashboardService {
  // 查询看板列表
  rpc List (pagination.PagingRequest) returns (ListDashboardResponse) {}

  // 查询看板数量
  rpc Count (pagination.PagingRequest) returns (CountDashboardResponse) {}

  // 查询看板详情
  rpc Get (GetDashboardRequest) returns (Dashboard) {}

  // 创建看板
  rpc Create (CreateDashboardRequest) returns (Dashboard) {}

  // 更新看板
  rpc Update (UpdateDashboardRequest) returns (Dashboard) {}

  // 删除看板
  rpc Delete (DeleteDashboardRequest) returns (google.protobuf.Empty) {}
}

// 看板组件
message DashboardWidget {
  string id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "组件ID（看板内唯一）"}]; // 组件ID
  string title = 2 [json_name = "title", (gnostic.openapi.v3.property) = {description: "组件标题"}]; // 组件标题

  // 分析模型标识，对应分析页的模型名（如 event-trend / funnel / retention）
  string model = 3 [json_name = "model", (gnostic.openapi.v3.property) = {description: "分析模型标识"}]; // 分析模型标识

  // 该模型请求参数的 JSON 快照（与对应分析 API 的请求体一致）
  string params_json = 4 [json_name = "paramsJson", (gnostic.openapi.v3.property) = {description: "分析请求参数 JSON 快照"}]; // 参数快照

  // 栅格宽度（1~24），默认 12 即半行
  optional int32 span = 5 [json_name = "span", (gnostic.openapi.v3.property) = {description: "栅格宽度（1~24），默认12"}]; // 栅格宽度
}

// 自定义看板
message Dashboard {
  int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "主键ID，唯一标识看板"}
  ]; // 主键ID

  optional int64 tenant_id = 2 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，多租户隔离，支持SaaS场景"}
  ]; // 租户ID
  optional int64 app_id = 3 [
    json_name = "appId",
    (gnostic.openapi.v3.property) = {description: "关联应用ID"}
  ]; // 关联应用ID

  optional string name = 4 [json_name = "name", (gnostic.openapi.v3.property) = {description: "看板名称"}]; // 看板名称
  optional string description = 5 [json_name = "description", (gnostic.openapi.v3.property) = {description: "看板描述"}]; // 看板描述

  repeated DashboardWidget widgets = 6 [json_name = "widgets", (gnostic.openapi.v3.property) = {description: "看板组件列表"}]; // 看板组件列表

  optional bool enabled = 7 [json_name = "enabled", (gnostic.openapi.v3.property) = {description: "是否启用"}]; // 是否启用

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 获取看板列表 - 答复
message ListDashboardResponse {
  repeated Dashboard items = 1 [json_name = "items", (gnostic.openapi.v3.property) = {description: "看板列表"}]; // 看板列表
  int64 total = 2 [json_name = "total", (gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 获取看板数据 - 请求
message GetDashboardRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器，用于控制返回的字段"}]; // 视图字段过滤器
}

// 创建看板 - 请求
message CreateDashboardRequest {
  Dashboard data = 1 [json_name = "data", (gnostic.openapi.v3.property) = {description: "看板数据"}]; // 看板数据
}

// 更新看板 - 请求
message UpdateDashboardRequest {
  int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "看板ID"}]; // 看板ID

  Dashboard data = 2 [json_name = "data", (gnostic.openapi.v3.property) = {description: "看板数据"}]; // 看板数据

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask", (gnostic.openapi.v3.property) = {description: "要更新的字段列表"}]; // 要更新的字段列表

  optional bool allow_missing = 4 [json_name = "allowMissing", (gnostic.openapi.v3.property) = {description: "如果设置为true，资源不存在则会新增(插入)"}]; // 资源不存在时自动新增
}

// 删除看板 - 请求
message DeleteDashboardRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional int64 deleted_by = 100 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID
}

// 看板数量 - 答复
message CountDashboardResponse {
  int64 count = 1 [json_name = "count", (gnostic.openapi.v3.property) = {description: "数量"}]; // 数量
}
