syntax = "proto3";

package uba.service.v1;

import "errors/errors.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";


// 可视化埋点服务：把"页面 + 元素选择器"映射为事件名，SDK 点击采集时按规则上报
service VisualEventService {
  // 查询可视化埋点列表
  rpc List (pagination.PagingRequest) returns (ListVisualEventResponse) {}

  // 查询可视化埋点数量
  rpc Count (pagination.PagingRequest) returns (CountVisualEventResponse) {}

  // 查询可视化埋点详情
  rpc Get (GetVisualEventRequest) returns (VisualEvent) {}

  // 创建可视化埋点
  rpc Create (CreateVisualEventRequest) returns (VisualEvent) {}

  // 更新可视化埋点
  rpc Update (UpdateVisualEventRequest) returns (VisualEvent) {}

  // 删除可视化埋点
  rpc Delete (DeleteVisualEventRequest) returns (google.protobuf.Empty) {}

  // 为应用下发启用的埋点规则（collector 的 /uba/v1/visual-events 端点背后就是它）
  rpc ListForApp (ListVisualEventsForAppRequest) returns (ListVisualEventsForAppResponse) {}
}

// 元素匹配方式
enum VisualMatchType {
  // 未指定，默认 XPath 精确匹配
  VISUAL_MATCH_TYPE_UNSPECIFIED = 0;
  // XPath 精确匹配
  XPATH_EXACT = 1;
  // XPath 前缀匹配（匹配动态容器内的元素族）
  XPATH_PREFIX = 2;
}

// 可视化埋点规则
message VisualEvent {
  int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "主键ID"}
  ]; // 主键ID

  optional int64 tenant_id = 2 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ]; // 租户ID
  optional string app_id = 3 [
    json_name = "appId",
    (gnostic.openapi.v3.property) = {description: "关联应用标识"}
  ]; // 关联应用标识

  // 事件名（点击命中后上报的事件）
  optional string event_name = 4 [json_name = "eventName", (gnostic.openapi.v3.property) = {description: "事件名"}]; // 事件名
  // 显示名
  optional string display_name = 5 [json_name = "displayName", (gnostic.openapi.v3.property) = {description: "显示名"}]; // 显示名

  // 规则作用页面（前缀匹配；空为全部页面）
  optional string page_url = 6 [json_name = "pageUrl", (gnostic.openapi.v3.property) = {description: "页面 URL 前缀"}]; // 页面前缀

  // 元素 XPath（SDK 点击采集时同口径生成）
  optional string element_xpath = 7 [json_name = "elementXpath", (gnostic.openapi.v3.property) = {description: "元素 XPath"}]; // 元素 XPath
  // 匹配方式
  optional VisualMatchType match_type = 8 [json_name = "matchType", (gnostic.openapi.v3.property) = {description: "匹配方式"}]; // 匹配方式

  // 随事件上报的静态属性
  map<string, string> properties = 9 [json_name = "properties", (gnostic.openapi.v3.property) = {description: "静态属性"}]; // 静态属性

  optional bool enabled = 10 [json_name = "enabled", (gnostic.openapi.v3.property) = {description: "是否启用"}]; // 是否启用

  optional string remark = 20 [json_name = "remark", (gnostic.openapi.v3.property) = {description: "备注"}]; // 备注

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 按应用下发启用规则 - 请求（collector 转发）
message ListVisualEventsForAppRequest {
  optional string app_id = 1 [json_name = "appId", (gnostic.openapi.v3.property) = {description: "应用标识"}]; // 应用标识
  optional int64 tenant_id = 2 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID（服务端可覆盖）"}]; // 租户ID
}

// 按应用下发启用规则 - 答复
message ListVisualEventsForAppResponse {
  repeated VisualEvent items = 1 [json_name = "items", (gnostic.openapi.v3.property) = {description: "启用规则列表"}]; // 启用规则列表
}

// 获取可视化埋点列表 - 答复
message ListVisualEventResponse {
  repeated VisualEvent items = 1 [json_name = "items", (gnostic.openapi.v3.property) = {description: "埋点列表"}]; // 埋点列表
  int64 total = 2 [json_name = "total", (gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 获取可视化埋点数据 - 请求
message GetVisualEventRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}]; // 视图字段过滤器
}

// 创建可视化埋点 - 请求
message CreateVisualEventRequest {
  VisualEvent data = 1 [json_name = "data", (gnostic.openapi.v3.property) = {description: "埋点数据"}]; // 埋点数据
}

// 更新可视化埋点 - 请求
message UpdateVisualEventRequest {
  int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "埋点ID"}]; // 埋点ID

  VisualEvent data = 2 [json_name = "data", (gnostic.openapi.v3.property) = {description: "埋点数据"}]; // 埋点数据

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask", (gnostic.openapi.v3.property) = {description: "要更新的字段列表"}]; // 要更新的字段列表

  optional bool allow_missing = 4 [json_name = "allowMissing", (gnostic.openapi.v3.property) = {description: "资源不存在时自动新增"}]; // 资源不存在时自动新增
}

// 删除可视化埋点 - 请求
message DeleteVisualEventRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional int64 deleted_by = 100 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID
}

// 可视化埋点数量 - 答复
message CountVisualEventResponse {
  int64 count = 1 [json_name = "count", (gnostic.openapi.v3.property) = {description: "数量"}]; // 数量
}

// 可视化埋点错误原因
enum VisualEventErrorReason {
  option (errors.default_code) = 500;

  // 错误请求
  VISUAL_EVENT_BAD_REQUEST = 0 [(errors.code) = 400];
  // 规则不存在
  VISUAL_EVENT_NOT_FOUND = 404 [(errors.code) = 404];
  // 内部错误
  VISUAL_EVENT_INTERNAL_ERROR = 500 [(errors.code) = 500];
}
