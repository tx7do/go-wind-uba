syntax = "proto3";

package uba.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";


// 指标阈值告警服务
service AlertRuleService {
  // 查询告警规则列表
  rpc List (pagination.PagingRequest) returns (ListAlertRuleResponse) {}

  // 查询告警规则数量
  rpc Count (pagination.PagingRequest) returns (CountAlertRuleResponse) {}

  // 查询告警规则详情
  rpc Get (GetAlertRuleRequest) returns (AlertRule) {}

  // 创建告警规则
  rpc Create (CreateAlertRuleRequest) returns (AlertRule) {}

  // 更新告警规则
  rpc Update (UpdateAlertRuleRequest) returns (AlertRule) {}

  // 删除告警规则
  rpc Delete (DeleteAlertRuleRequest) returns (google.protobuf.Empty) {}
}

// 聚合方式
enum AlertAggregator {
  // 未指定，默认按事件量 COUNT
  ALERT_AGGREGATOR_UNSPECIFIED = 0;
  // 事件量
  COUNT = 1;
  // 活跃用户数
  ACTIVE_USERS = 2;
  // 金额求和（amount 列）
  SUM_AMOUNT = 3;
  // 金额均值（amount 列）
  AVG_AMOUNT = 4;
}

// 比较算子
enum AlertComparison {
  // 未指定，默认大于
  ALERT_COMPARISON_UNSPECIFIED = 0;
  // 大于
  GT = 1;
  // 大于等于
  GTE = 2;
  // 小于
  LT = 3;
  // 小于等于
  LTE = 4;
}

// 通知渠道
enum AlertChannel {
  // 未指定
  ALERT_CHANNEL_UNSPECIFIED = 0;
  // 网络钩子
  WEBHOOK = 1;
  // 站内信
  INTERNAL_MESSAGE = 2;
}

// 指标阈值告警规则
message AlertRule {
  int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "主键ID，唯一标识告警规则"}
  ]; // 主键ID

  optional int64 tenant_id = 2 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，多租户隔离，支持SaaS场景"}
  ]; // 租户ID
  optional int64 app_id = 3 [
    json_name = "appId",
    (gnostic.openapi.v3.property) = {description: "关联应用ID（分析域数字ID），0/不传为全部应用"}
  ]; // 关联应用ID

  optional string name = 4 [json_name = "name", (gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  optional string description = 5 [json_name = "description", (gnostic.openapi.v3.property) = {description: "规则描述"}]; // 规则描述

  optional string event_name = 6 [json_name = "eventName", (gnostic.openapi.v3.property) = {description: "监控的事件名，空为全部事件"}]; // 监控事件名
  optional AlertAggregator aggregator = 7 [json_name = "aggregator", (gnostic.openapi.v3.property) = {description: "聚合方式"}]; // 聚合方式

  optional AlertComparison comparison = 8 [json_name = "comparison", (gnostic.openapi.v3.property) = {description: "比较算子"}]; // 比较算子
  optional double threshold = 9 [json_name = "threshold", (gnostic.openapi.v3.property) = {description: "阈值"}]; // 阈值

  optional int32 window_minutes = 10 [json_name = "windowMinutes", (gnostic.openapi.v3.property) = {description: "统计窗口长度（分钟）"}]; // 统计窗口（分钟）
  optional int32 silence_minutes = 11 [json_name = "silenceMinutes", (gnostic.openapi.v3.property) = {description: "告警静默时长（分钟）"}]; // 告警静默（分钟）

  repeated AlertChannel channels = 12 [json_name = "channels", (gnostic.openapi.v3.property) = {description: "通知渠道列表"}]; // 通知渠道

  optional bool enabled = 13 [json_name = "enabled", (gnostic.openapi.v3.property) = {description: "是否启用"}]; // 是否启用
  optional google.protobuf.Timestamp last_triggered_at = 14 [json_name = "lastTriggeredAt", (gnostic.openapi.v3.property) = {description: "最后触发时间"}]; // 最后触发时间

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 获取告警规则列表 - 答复
message ListAlertRuleResponse {
  repeated AlertRule items = 1 [json_name = "items", (gnostic.openapi.v3.property) = {description: "告警规则列表"}]; // 告警规则列表
  int64 total = 2 [json_name = "total", (gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 获取告警规则数据 - 请求
message GetAlertRuleRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器，用于控制返回的字段"}]; // 视图字段过滤器
}

// 创建告警规则 - 请求
message CreateAlertRuleRequest {
  AlertRule data = 1 [json_name = "data", (gnostic.openapi.v3.property) = {description: "告警规则数据"}]; // 告警规则数据
}

// 更新告警规则 - 请求
message UpdateAlertRuleRequest {
  int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "告警规则ID"}]; // 告警规则ID

  AlertRule data = 2 [json_name = "data", (gnostic.openapi.v3.property) = {description: "告警规则数据"}]; // 告警规则数据

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask", (gnostic.openapi.v3.property) = {description: "要更新的字段列表"}]; // 要更新的字段列表

  optional bool allow_missing = 4 [json_name = "allowMissing", (gnostic.openapi.v3.property) = {description: "如果设置为true，资源不存在则会新增(插入)"}]; // 资源不存在时自动新增
}

// 删除告警规则 - 请求
message DeleteAlertRuleRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional int64 deleted_by = 100 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID
}

// 告警规则数量 - 答复
message CountAlertRuleResponse {
  int64 count = 1 [json_name = "count", (gnostic.openapi.v3.property) = {description: "数量"}]; // 数量
}
