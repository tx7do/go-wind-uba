syntax = "proto3";

package uba.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

import "uba/service/v1/analytics.proto";


// 功能开关/AB实验服务
service FeatureFlagService {
  // 查询开关列表
  rpc List (pagination.PagingRequest) returns (ListFeatureFlagResponse) {}

  // 查询开关数量
  rpc Count (pagination.PagingRequest) returns (CountFeatureFlagResponse) {}

  // 查询开关详情
  rpc Get (GetFeatureFlagRequest) returns (FeatureFlag) {}

  // 创建开关
  rpc Create (CreateFeatureFlagRequest) returns (FeatureFlag) {}

  // 更新开关
  rpc Update (UpdateFeatureFlagRequest) returns (FeatureFlag) {}

  // 删除开关
  rpc Delete (DeleteFeatureFlagRequest) returns (google.protobuf.Empty) {}

  // 为一个身份评估全部启用开关（collector 的 /uba/v1/flags 端点背后就是它）
  rpc EvaluateFlags (EvaluateFlagsRequest) returns (EvaluateFlagsResponse) {}

  // 实验结果：各变体曝光人数与目标事件转化率
  rpc GetFlagResult (GetFlagResultRequest) returns (FlagResultResponse) {}
}

// 实验变体
message FeatureFlagVariant {
  // 变体标识（如 control / treatment_a）
  string key = 1 [json_name = "key", (gnostic.openapi.v3.property) = {description: "变体标识"}]; // 变体标识
  // 显示名称
  optional string name = 2 [json_name = "name", (gnostic.openapi.v3.property) = {description: "显示名称"}]; // 显示名称
  // 千分比权重（0~1000），按比例归一
  int32 weight = 3 [json_name = "weight", (gnostic.openapi.v3.property) = {description: "千分比权重"}]; // 权重
}

// 功能开关/AB实验
message FeatureFlag {
  int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "主键ID"}
  ]; // 主键ID

  optional int64 tenant_id = 2 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ]; // 租户ID
  optional int64 app_id = 3 [
    json_name = "appId",
    (gnostic.openapi.v3.property) = {description: "关联应用ID，空为全部应用"}
  ]; // 关联应用ID

  optional string key = 4 [json_name = "key", (gnostic.openapi.v3.property) = {description: "开关唯一标识（租户内唯一）"}]; // 开关标识
  optional string name = 5 [json_name = "name", (gnostic.openapi.v3.property) = {description: "显示名称"}]; // 显示名称
  optional string description = 6 [json_name = "description", (gnostic.openapi.v3.property) = {description: "描述"}]; // 描述

  repeated FeatureFlagVariant variants = 7 [json_name = "variants", (gnostic.openapi.v3.property) = {description: "实验变体列表"}]; // 实验变体

  optional int32 rollout_percentage = 8 [json_name = "rolloutPercentage", (gnostic.openapi.v3.property) = {description: "放量百分比 0~100"}]; // 放量百分比

  optional string goal_event_name = 9 [json_name = "goalEventName", (gnostic.openapi.v3.property) = {description: "目标转化事件名（实验分析用）"}]; // 目标事件

  optional bool enabled = 10 [json_name = "enabled", (gnostic.openapi.v3.property) = {description: "是否启用"}]; // 是否启用
  optional google.protobuf.Timestamp started_at = 11 [json_name = "startedAt", (gnostic.openapi.v3.property) = {description: "实验开始时间"}]; // 开始时间
  optional google.protobuf.Timestamp ended_at = 12 [json_name = "endedAt", (gnostic.openapi.v3.property) = {description: "实验结束时间"}]; // 结束时间

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 评估请求：为指定身份（设备或用户）计算所有启用开关的变体
message EvaluateFlagsRequest {
  optional int64 tenant_id = 1 [json_name = "tenantId"]; // 租户ID（服务端可覆盖）
  optional int64 app_id = 2 [json_name = "appId"]; // 应用ID过滤
  // 身份标识：优先 user_id，否则 device_id
  optional int64 user_id = 3 [json_name = "userId"]; // 用户ID
  optional string device_id = 4 [json_name = "deviceId"]; // 设备ID
}

// 评估结果：flag key → 变体 key（未命中放量/停用的开关不出现在结果里）
message EvaluateFlagsResponse {
  map<string, string> flags = 1 [json_name = "flags", (gnostic.openapi.v3.property) = {description: "flag key → 变体 key"}]; // 评估结果
}

// 实验结果请求
message GetFlagResultRequest {
  int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "开关ID"}]; // 开关ID

  // 分析时间范围（缺省为近 30 天）
  optional TimeRange time_range = 2 [json_name = "timeRange"]; // 时间范围
}

// 实验结果：单变体的曝光与转化
message FlagVariantResult {
  // 变体标识
  string variant = 1 [json_name = "variant", (gnostic.openapi.v3.property) = {description: "变体标识"}]; // 变体标识
  // 曝光用户数（触发过 $feature_flag 事件的登录用户）
  uint64 exposed_users = 2 [json_name = "exposedUsers", (gnostic.openapi.v3.property) = {description: "曝光用户数"}]; // 曝光用户数
  // 目标事件转化用户数
  uint64 converted_users = 3 [json_name = "convertedUsers", (gnostic.openapi.v3.property) = {description: "转化用户数"}]; // 转化用户数
  // 转化率（0~1）
  double conversion_rate = 4 [json_name = "conversionRate", (gnostic.openapi.v3.property) = {description: "转化率"}]; // 转化率
}

// 实验结果答复
message FlagResultResponse {
  // 开关信息
  FeatureFlag flag = 1 [json_name = "flag", (gnostic.openapi.v3.property) = {description: "开关信息"}]; // 开关信息
  // 各变体结果
  repeated FlagVariantResult variants = 2 [json_name = "variants", (gnostic.openapi.v3.property) = {description: "各变体结果"}]; // 变体结果
  // 配置的目标事件
  optional string goal_event_name = 3 [json_name = "goalEventName", (gnostic.openapi.v3.property) = {description: "目标事件"}]; // 目标事件
}

// 获取开关列表 - 答复
message ListFeatureFlagResponse {
  repeated FeatureFlag items = 1 [json_name = "items", (gnostic.openapi.v3.property) = {description: "开关列表"}]; // 开关列表
  int64 total = 2 [json_name = "total", (gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 获取开关数据 - 请求
message GetFeatureFlagRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}]; // 视图字段过滤器
}

// 创建开关 - 请求
message CreateFeatureFlagRequest {
  FeatureFlag data = 1 [json_name = "data", (gnostic.openapi.v3.property) = {description: "开关数据"}]; // 开关数据
}

// 更新开关 - 请求
message UpdateFeatureFlagRequest {
  int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "开关ID"}]; // 开关ID

  FeatureFlag data = 2 [json_name = "data", (gnostic.openapi.v3.property) = {description: "开关数据"}]; // 开关数据

  google.protobuf.FieldMask update_mask = 3 [json_name = "updateMask", (gnostic.openapi.v3.property) = {description: "要更新的字段列表"}]; // 要更新的字段列表

  optional bool allow_missing = 4 [json_name = "allowMissing", (gnostic.openapi.v3.property) = {description: "资源不存在时自动新增"}]; // 资源不存在时自动新增
}

// 删除开关 - 请求
message DeleteFeatureFlagRequest {
  oneof query_by {
    int64 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "ID", read_only: true}]; // ID
  }

  optional int64 deleted_by = 100 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID
}

// 开关数量 - 答复
message CountFeatureFlagResponse {
  int64 count = 1 [json_name = "count", (gnostic.openapi.v3.property) = {description: "数量"}]; // 数量
}

// SDK 获取开关取值请求（collector 转发到 core 评估）
message PostFlagsRequest {
  // 应用 ID（鉴权）
  string app_id = 1 [json_name = "appId", (gnostic.openapi.v3.property) = {description: "应用 ID"}]; // 应用 ID
  // 应用密钥（鉴权）
  string app_secret = 2 [json_name = "appSecret", (gnostic.openapi.v3.property) = {description: "应用密钥"}]; // 应用密钥
  // 设备 ID（未登录时作为分配身份）
  optional string device_id = 3 [json_name = "deviceId", (gnostic.openapi.v3.property) = {description: "设备 ID"}]; // 设备 ID
  // 用户 ID（登录后优先作为分配身份）
  optional int64 user_id = 4 [json_name = "userId", (gnostic.openapi.v3.property) = {description: "用户 ID"}]; // 用户 ID
}

// SDK 获取开关取值答复
message PostFlagsResponse {
  // flag key → 变体 key（未命中放量/停用的开关不在结果中）
  map<string, string> flags = 1 [json_name = "flags", (gnostic.openapi.v3.property) = {description: "flag key → 变体 key"}]; // 评估结果
}
