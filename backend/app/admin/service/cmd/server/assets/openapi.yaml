                    description: 服务端生成的验证码会话ID（可选）
        VisualEvent:
            type: object
            properties:
                id:
                    type: string
                    description: 主键ID
                tenantId:
                    type: string
                    description: 租户ID
                appId:
                    type: string
                    description: 关联应用标识
                eventName:
                    type: string
                    description: 事件名
                displayName:
                    type: string
                    description: 显示名
                pageUrl:
                    type: string
                    description: 页面 URL 前缀
                elementXpath:
                    type: string
                    description: 元素 XPath
                matchType:
                    enum:
                        - VISUAL_MATCH_TYPE_UNSPECIFIED
                        - XPATH_EXACT
                        - XPATH_PREFIX
                    type: string
                    description: 匹配方式
                    format: enum
                properties:
                    type: object
                    additionalProperties:
                        type: string
                    description: 静态属性
                enabled:
                    type: boolean
                    description: 是否启用
                remark:
                    type: string
                    description: 备注
                createdBy:
                    type: string
                    description: 创建者用户ID
                updatedBy:
                    type: string
                    description: 更新者用户ID
                deletedBy:
                    type: string
                    description: 删除者用户ID
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 可视化埋点规则
        Webhook:
            type: object
            properties:
                id:
                    type: string
                    description: 主键ID，唯一标识Webhook配置
                tenantId:
                    type: string
                    description: 租户ID，多租户隔离，支持SaaS场景
                appId:
                    type: string
                    description: 关联的应用标识（对应 Application.app_id）
                name:
                    type: string
                    description: Webhook名称
                url:
                    type: string
                    description: 回调URL
                secret:
                    type: string
                    description: 签名密钥（写入时返回，读取时脱敏）
                eventTypes:
                    type: array
                    items:
                        type: string
                    description: 触发事件类型列表，如["risk.high", "risk.critical"]
                filter:
                    $ref: '#/components/schemas/WebhookFilter'
                enabled:
                    type: boolean
                    description: 是否启用，true为启用，false为禁用
                failureCount:
                    type: integer
                    description: 失败次数
                    format: uint32
                lastTriggeredAt:
                    type: string
                    description: 最后触发时间
                    format: date-time
                createdBy:
                    type: string
                    description: 创建者用户ID
                updatedBy:
                    type: string
                    description: 更新者用户ID
                deletedBy:
                    type: string
                    description: 删除者用户ID
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 网络钩子配置
        WebhookDeliveryLog:
            type: object
            properties:
                id:
                    type: string
                    description: 日志主键ID
                webhookId:
                    type: string
                    description: Webhook配置ID
                tenantId:
                    type: string
                    description: 租户ID
                eventType:
                    type: string
                    description: 事件类型
                payload:
                    type: string
                    description: 发送的payload内容
                statusCode:
                    type: integer
                    description: HTTP状态码
                    format: int32
                responseBody:
                    type: string
                    description: 响应内容
                retryCount:
                    type: integer
                    description: 重试次数
                    format: uint32
                sentAt:
                    type: string
                    description: 发送时间
                    format: date-time
                errorMessage:
                    type: string
                    description: 错误信息
                success:
                    type: boolean
                    description: 是否投递成功
            description: 网络钩子投递日志
        WebhookFilter:
            type: object
            properties:
                riskLevels:
                    type: array
                    items:
                        type: string
                    description: 风险等级过滤
                riskTypes:
                    type: array
                    items:
                        type: string
                    description: 风险类型过滤
                properties:
                    type: object
                    additionalProperties:
                        type: string
                    description: 事件属性过滤，键值对
            description: 网络钩子过滤器
        WhaleTierRequest:
            type: object
            properties:
                appId:
                    type: string
                    description: 应用 ID 过滤（可选）
            description: ============== 鲸鱼用户/付费分层 ==============
        WhaleTierResponse:
            type: object
            properties:
                segments:
                    type: array
                    items:
                        $ref: '#/components/schemas/PayTierSegment'
                    description: 各付费分层
                totalUsers:
                    type: string
                    description: 总用户数
                totalRevenue:
                    type: number
                    description: 总流水
                    format: double
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh_token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AdminPortalService
      description: 后台前端初始化数据与配置服务
    - name: AiChatService
      description: AI 对话（BFF 编排：消费 core 流式 RPC，chunk/tool 转 SSE 推送，done 作同步响应）
    - name: AiConversationService
      description: AI 对话会话管理（BFF 透传 core；归属校验在 core 侧按操作者执行）
    - name: AiKnowledgeBaseService
      description: AI 知识库管理（RAG：文档切片 → embedding → 向量检索；BFF 透传 core）
    - name: AiMessageService
      description: AI 对话消息查询（BFF 透传 core；仅本人会话可见）
    - name: AiProviderService
      description: AI 模型提供商管理（BFF：操作人注入 + api_key 加密后透传 core）
    - name: AiQueryService
      description: 智能问数（NL → 只读 SQL → 结构化结果；对 OLAP 分析库执行）
    - name: AiUsageLogService
