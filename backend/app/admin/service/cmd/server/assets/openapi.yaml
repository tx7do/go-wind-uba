                tenantName:
                    type: string
                    description: 租户名称
                userId:
                    type: string
                    description: 用户ID
                username:
                    type: string
                    description: 账号名
                ipAddress:
                    type: string
                    description: 操作IP地址（IPv4/IPv6）
                requestId:
                    type: string
                    description: 全局请求ID（关联网关日志）
                dataSource:
                    type: string
                    description: 数据源类型（mysql/redis/mongodb/es）
                tableName:
                    type: string
                    description: 数据表名（如sys_users/order_info，Redis为key前缀）
                dataId:
                    type: string
                    description: 数据主键ID（如用户ID/订单ID，兼容不同表主键类型）
                accessType:
                    enum:
                        - ACCESS_TYPE_UNSPECIFIED
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - VIEW
                        - BULK_READ
                        - EXPORT
                        - IMPORT
                        - DDL_CREATE
                        - DDL_ALTER
                        - DDL_DROP
                        - METADATA_READ
                        - SCAN
                        - ADMIN_OPERATION
                        - OTHER
                    type: string
                    description: 数据访问类型（SELECT/INSERT/UPDATE/DELETE）
                    format: enum
                sqlDigest:
                    type: string
                    description: 执行的SQL语句摘要（MD5）
                sqlText:
                    type: string
                    description: 执行的SQL语句（脱敏后，Redis为命令）
                affectedRows:
                    type: integer
                    description: 影响行数（Redis为影响key数量）
                    format: uint32
                latencyMs:
                    type: integer
                    description: 延迟时间（毫秒）
                    format: uint32
                success:
                    type: boolean
                    description: 操作是否成功
                sensitiveLevel:
                    enum:
                        - SENSITIVE_LEVEL_UNSPECIFIED
                        - PUBLIC
                        - INTERNAL
                        - CONFIDENTIAL
                        - SECRET
                    type: string
                    description: 数据敏感级别
                    format: enum
                dataMasked:
                    type: boolean
                    description: 是否已脱敏
                maskingRules:
                    type: string
                    description: 脱敏规则（JSON：{"phone":"mask_last_4"}）
                businessPurpose:
                    type: string
                    description: 业务处理目的
                dataCategory:
                    type: string
                    description: 数据分类标签
                dbUser:
                    type: string
                    description: 数据库用户
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
            description: 数据访问审计日志
