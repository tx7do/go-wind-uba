                appId:
                    type: string
                    description: 应用 ID 过滤（可选）
                levelId:
                    type: string
                    description: 指定关卡 ID（可选，空表示全部关卡）
            description: ============== 关卡/数值平衡分析 ==============
        LevelAnalysisResponse:
            type: object
            properties:
                levels:
                    type: array
                    items:
                        $ref: '#/components/schemas/LevelStat'
                    description: 各关卡统计（按 player_count 降序）
        LevelStat:
            type: object
            properties:
                levelId:
                    type: string
                    description: 关卡 ID
                levelName:
                    type: string
                    description: 关卡名
                attemptCount:
                    type: string
                    description: 尝试次数（level_start）
                finishCount:
                    type: string
                    description: 完成次数（level_finish）
                failCount:
                    type: string
                    description: 失败次数（level_fail）
                passRate:
                    type: number
                    description: 通过率（0-1，finish / (finish+fail)）
                    format: double
                stuckRate:
                    type: number
                    description: 卡关率（0-1，1 - passRate，值越高说明越难/流失点）
                    format: double
                avgScore:
                    type: number
                    description: 平均分
                    format: double
                star3Rate:
                    type: number
                    description: 满星率（0-1，context['stars']==3 占比）
                    format: double
                playerCount:
                    type: string
                    description: 挑战该关卡的玩家数（去重）
            description: 单关分析结果
