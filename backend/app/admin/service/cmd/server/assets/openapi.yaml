                  in: query
                  description: 最多返回的记录数（默认10，建议设置上限如100）
                  schema:
                    type: integer
                    format: uint32
                - name: token
                  in: query
                  description: 上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）
                  schema:
                    type: string
                - name: noPaging
                  in: query
                  description: 是否不分页，如果为true，则page和pageSize参数无效。
                  schema:
                    type: boolean
                - name: query
                  in: query
                  description: JSON字符串过滤条件，基础语法：{"field1":"val1", "field2___icontains":"val2"}，具体请参见：https://github.com/tx7do/go-crud/tree/main/pagination/filter/README.md
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Google AIP规范字符串过滤条件
                  schema:
                    type: string
                - name: filterExpr.type
                  in: query
                  description: 过滤表达式类型
                  schema:
                    enum:
                        - EXPR_TYPE_UNSPECIFIED
                        - AND
                        - OR
                    type: string
                    format: enum
                - name: orderBy
                  in: query
                  description: 排序条件
                  schema:
                    type: string
                - name: fieldMask
                  in: query
                  description: 字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名，例如：id,realName,userName。如果为空则选中所有字段，即SELECT *。
                  schema:
                    type: string
                    format: field-mask
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CountWebhookResponse'
    /admin/v1/webhooks/{id}:
        get:
            tags:
                - WebhookService
            description: 查询网络钩子详情
            operationId: WebhookService_Get
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: viewMask
                  in: query
                  schema:
                    type: string
                    format: field-mask
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Webhook'
        put:
            tags:
                - WebhookService
            description: 更新网络钩子
            operationId: WebhookService_Update
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWebhookRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Webhook'
        delete:
            tags:
                - WebhookService
            description: 删除网络钩子
            operationId: WebhookService_Delete
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: deletedBy
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /admin/v1/webhooks/{webhookId}/delivery-logs:
        get:
            tags:
                - WebhookService
            description: 查询网络钩子投递日志
            operationId: WebhookService_ListDeliveryLogs
            parameters:
                - name: webhookId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: success
                  in: query
                  description: 按投递结果过滤，不传则返回全部
                  schema:
                    type: boolean
                - name: limit
                  in: query
                  description: 返回条数上限（默认 50，最新在前）
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListWebhookDeliveryLogResponse'
