  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: etcd
    hostname: etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - app-tier
    environment:
      - ETCDCTL_API=3
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://127.0.0.1:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://127.0.0.1:2380
      - ETCD_INITIAL_CLUSTER=default=http://127.0.0.1:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-token
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=default

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    container_name: jaeger
    hostname: jaeger
    restart: always
    ports:
      - "6831:6831/udp"
      - "5778:5778"
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
    networks:
      - app-tier
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true

  redis:
    image: docker.io/bitnami/redis:latest
    container_name: redis
    hostname: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-tier
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=*Abcd123456
      - REDIS_AOF_ENABLED=no
      - REDIS_IO_THREADS_DO_READS=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
  #    volumes:
  #      - ${APP_ROOT:-/root/app}/redis/data:/bitnami/redis/data

  kafka:
    image: docker.io/bitnami/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - app-tier
    environment:
      - TZ=Asia/Shanghai
      # KRaft
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      # Listeners
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - /root/app/kafka:/bitnami/kafka
    logging:
      options:
        max-size: '500m'

  minio:
    image: docker.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: always
    ports:
      - "9001:9000"
      - "9002:9001"
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=*Abcd123456
      - MINIO_DEFAULT_BUCKETS=images
      - MINIO_FORCE_NEW_KEYS=yes
      - BITNAMI_DEBUG=true
    #    volumes:
    #      - ${APP_ROOT:-/root/app}/minio/data:/data
    command: server /data --console-address ':9001'

  postgres:
    image: docker.io/bitnami/postgresql:latest
    container_name: postgres
    hostname: postgres
    restart: always
    ports:
      - "5432:5432"
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=*Abcd123456
      - POSTGRES_DB=gw_uba

  #  mysql:
  #    image: docker.io/bitnami/mariadb:latest
  #    container_name: mysql
  #    hostname: mysql
  #    restart: always
  #    ports:
  #      - "3306:3306"
  #    networks:
  #      - app-tier
  #    environment:
  #      - MARIADB_ROOT_PASSWORD=*Abcd123456
  #      - MARIADB_USER=admin
  #      - MARIADB_PASSWORD=*Abcd123456
  #      - MARIADB_DATABASE=gw_uba
  #      - ALLOW_EMPTY_PASSWORD=yes
  #      - TZ=Asia/Shanghai

  #  clickhouse:
  #    image: docker.io/bitnami/clickhouse:latest
  #    container_name: clickhouse
  #    hostname: clickhouse
  #    restart: always
  #    ports:
  #      - "9000:9000"
  #      - "8123:8123"
  #      - "9009:9009"
  #    networks:
  #      - app-tier
  #    environment:
  #      - CLICKHOUSE_USER=default
  #      - CLICKHOUSE_PASSWORD=*Abcd123456
  #      - CLICKHOUSE_DB=gw_uba
  #      - CLICKHOUSE_ENABLE_HTTP=true
  #      - CLICKHOUSE_ENABLE_NATIVE=true
  #      - CLICKHOUSE_ENABLE_TCP=true

  doris-fe:
    image: apache/doris:fe-4.0.4
    container_name: doris-fe
    hostname: doris-fe
    restart: always
    ports:
      - "8030:8030"
      - "9030:9030"
      - "9010:9010"
    networks:
      - app-tier
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - FE_ID=1
    volumes:
      - /data/fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - /data/fe/conf:/opt/apache-doris/fe/conf
      - /data/fe/log:/opt/apache-doris/fe/log
    # Doris FE 需要静态 IP 时可用自定义 network
    # extra_hosts:
    #   - "fe1:172.20.80.2"

  doris-be:
    image: apache/doris:be-4.0.4
    container_name: doris-be
    hostname: doris-be
    restart: always
    ports:
      - "8040:8040"
      - "9050:9050"
    networks:
      - app-tier
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - BE_ADDR=172.20.80.3:9050
    volumes:
      - /data/be/storage:/opt/apache-doris/be/storage
      - /data/be/conf:/opt/apache-doris/be/conf
      - /data/be/log:/opt/apache-doris/be/log
    # Doris BE 需要静态 IP 时可用自定义 network
    # extra_hosts:
    #   - "be1:172.20.80.3"

  superset:
    image: apache/superset:latest
    container_name: superset
    hostname: superset
    restart: always
    user: root
    ports:
      - "8088:8088"
    networks:
      - app-tier
    environment:
      TZ: Asia/Shanghai
      SUPERSET_SECRET_KEY: "*Abcd123456"
      SUPERSET_ENV: production
    volumes:
      - ./superset_data:/app/data
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y gcc python3-dev default-libmysqlclient-dev pkg-config &&
      /app/.venv/bin/python -m ensurepip &&
      /app/.venv/bin/python -m pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/ &&
      /app/.venv/bin/python -m pip install pymysql pydoris -i https://mirrors.aliyun.com/pypi/simple/ && 
      superset db upgrade &&
      superset fab create-admin
          --username admin
          --password admin
          --firstname Admin
          --lastname Admin
          --email admin@admin.com || true &&
      superset init &&
      /usr/bin/run-server.sh
      "

  admin-service:
    image: go-wind-uba/admin-service:1.0.0
    restart: always
    pull_policy: never
    networks:
      - app-tier
    ports:
      - "5600:5600"
      - "5601:5601"
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
        APP_VERSION: 1.0.0

  collector-service:
    image: go-wind-uba/collector-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    ports:
      - "5700:5700"
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: collector
        APP_VERSION: 1.0.0

  core-service:
    image: go-wind-uba/core-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
        APP_VERSION: 1.0.0

  # ─────────────── 数据入仓运维（uba-ingest）───────────────
  # 事件的搬运本身由 Doris 的 Routine Load 负责，这两个容器只做装好它、盯住它那一段。
  # 都复用 core-service 的镜像与 /app/configs（里面有 data.doris.dsn）。

  # 一次性任务：建 gw_uba 的库表，并确保两个 Routine Load 消费任务在跑。
  # 幂等，所以每次 compose up 都可以重跑。
  ingest:
    image: go-wind-uba/core-service:1.0.0
    pull_policy: never
    restart: "no"
    networks:
      - app-tier
    depends_on:
      - kafka
      - doris-fe
      - doris-be
    environment:
      - TZ=Asia/Shanghai
      # core 的 configs 里没有 kafka 段，这里补上。写的是 Doris BE 视角下的地址，
      # 所以是容器网络里的服务名，而不是宿主机上看的 127.0.0.1:9092。
      - UBA_KAFKA_BROKERS=kafka:9092
    # Doris 第一次拉起要几分钟，--wait 让它自己等完，不必人工重跑
    entrypoint: [ "/app/bin/uba-ingest", "-c", "/app/configs", "apply", "--wait", "5m" ]
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
        APP_VERSION: 1.0.0

  # 常驻调度：每天 02:00 回算前一天（等价于宿主 cron，但不依赖 cron 与额外镜像）。
  # 失败自动重试 6 次，之后等下一个槽位——陈旧一天不该压过今晚这一天。
  ingest-etl:
    image: go-wind-uba/core-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    depends_on:
      ingest:
        condition: service_completed_successfully
      doris-be:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    entrypoint: [ "/app/bin/uba-ingest", "-c", "/app/configs", "etl", "--loop", "--at", "02:00" ]
    # 健康检查直接问 status：任一被脚本声明的 Routine Load 任务没在消费，容器就 unhealthy
    healthcheck:
      test: [ "CMD", "/app/bin/uba-ingest", "-c", "/app/configs", "status" ]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 3m
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
        APP_VERSION: 1.0.0
